<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>스며드는 중국어 365</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 폰 한 줄 앱. 옅은 비단색 표 위에 배운 한자만 청록 먹빛으로 번진다 */
:root{--bg:#F1ECE4;--paper:#FCFAF6;--ink:#1F1A17;--muted:#6E645B;--line:#DCD2C4;--accent:#0F6B5E;--accent-soft:#D7ECE7;--stamp:#B8322A;--ok:#1D8455;--ok-soft:#DCF0E4;--bad-soft:#F7DFDB;--snow:#FFFFFF;--f-kana:'Noto Serif SC','Songti SC','STSong','PingFang SC','Microsoft YaHei',serif;--f-disp:'Dela Gothic One','IBM Plex Sans KR',sans-serif;--f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151210;--paper:#1E1A17;--ink:#EFE8E0;--muted:#A79B90;--line:#3A322C;--accent:#5FCDB8;--accent-soft:#163A33;--stamp:#FF7B6F;--ok:#52C590;--ok-soft:#15372A;--bad-soft:#3E1F1C;--snow:#DCE4EC;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151210;--paper:#1E1A17;--ink:#EFE8E0;--muted:#A79B90;--line:#3A322C;--accent:#5FCDB8;--accent-soft:#163A33;--stamp:#FF7B6F;--ok:#52C590;--ok-soft:#15372A;--bad-soft:#3E1F1C;--snow:#DCE4EC;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;display:flex;flex-direction:column;gap:18px}

.jp{font-family:var(--f-kana)}
.jp .ck{white-space:nowrap}
.jp b{font-weight:600;color:var(--accent)}
.jp b.hl{background:var(--accent-soft);border-radius:4px;padding:0 2px}
.jp i{font-style:normal;font-family:var(--f-body);color:var(--muted);font-size:.92em}
.jp .gap{display:inline-block;width:.4em}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.dayno{font-family:var(--f-disp);font-size:52px;line-height:1}
.dayno small{font-size:18px;color:var(--muted);margin-left:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.station{font-weight:700;margin-top:6px}
.stamp{width:78px;height:78px;border:2.5px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;text-align:center;transform:rotate(-8deg);flex-shrink:0}
.stamp b{font-family:var(--f-disp);font-size:24px;line-height:1;display:block}
.stamp span{font-size:10px;letter-spacing:.06em}

.ticket{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;
  background-image:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--line) 35%,transparent) 9px 10px)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{left:-10px;clip-path:inset(0 0 0 50%)}
.ticket::after{right:-10px;clip-path:inset(0 50% 0 0)}
.ticket h2{margin:0 0 4px;font-size:17px}
.ctx{margin:0 0 12px;color:var(--muted);font-size:13px}
.plan{display:grid;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.plan li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:7px}
.plan li span:first-child{color:var(--muted);font-size:13px;flex-shrink:0}
.plan li span:last-child{text-align:right}
.plan .kchips{font-family:var(--f-kana);font-size:21px;color:var(--accent);font-weight:600;letter-spacing:.12em}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:16px;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:500;font-size:14px;padding:11px}
.btn:disabled{opacity:.4;cursor:default}
.row2{display:flex;gap:8px;margin-top:8px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:6px 0}

.sec h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:500}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.sec p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.sample{font-size:21px;margin-top:6px}
.route{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.st{aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:10.5px;color:var(--muted);background:var(--paper);font-variant-numeric:tabular-nums}
.st.now{border:2px solid var(--accent);color:var(--accent);font-weight:700}
.st.done{background:var(--stamp);border-color:var(--stamp);color:var(--paper);font-weight:700}

details{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
summary{cursor:pointer;font-weight:500}
.setting{display:flex;flex-direction:column;gap:10px;margin-top:12px}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:12px/1.4 monospace;padding:8px}
.toggle{display:flex;justify-content:space-between;align-items:center}
.sw{width:46px;height:26px;border-radius:13px;border:0;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:left .15s}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw[aria-pressed="true"]::after{left:23px}
.msg{font-size:13px;color:var(--ok);min-height:1em}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
.tabs button{flex:1;max-width:173px;background:none;border:0;padding:12px 4px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-family:var(--f-kana);font-size:20px;font-weight:600}
.tabs button[aria-current="true"]{color:var(--accent)}

.ktable{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kc{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;min-width:0}
.kc b{display:block;font-family:var(--f-kana);font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.kc span{font-size:11px;color:var(--muted)}
.kc.off b{color:var(--line)}
.kc.empty{visibility:hidden}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-family:var(--f-kana);font-size:16px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* 대화 말풍선 */
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:9px 12px;border-radius:14px;border:1px solid var(--line);background:var(--paper);min-width:0}
.bub.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-bottom-right-radius:4px}
.bub.you{align-self:flex-start;border-bottom-left-radius:4px}
.bub .who{font-size:11px;color:var(--muted);display:block}
.bub .bt{display:flex;gap:8px;align-items:center;justify-content:space-between}
.bub .jp{font-size:19px;line-height:1.5}
.bub p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.bub.ask{background:transparent;border:2px dashed var(--accent)}
.bub.ask .intent{font-weight:700;font-size:14px}
.bub.new{box-shadow:0 0 0 2px var(--accent)}
.play{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);flex-shrink:0;display:grid;place-items:center}
.play.s{width:30px;height:30px}
.play svg{width:13px;height:13px;fill:var(--accent)}
.scene h3{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;margin:10px 0 4px}
.scene h3 span{color:var(--muted);font-weight:400;font-size:12px}
.scene .ctx{margin:0 0 8px}
.vlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.vlist .lbl{font-size:12px;color:var(--muted)}
.locked{color:var(--muted);font-size:13px;padding:4px 2px}

/* 학습 화면 */
#sess[hidden]{display:none}
#sess{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.shead,.sbody,.sfoot{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shead{display:flex;align-items:center;gap:12px;padding-block:14px 6px}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);padding:4px}
.prog{flex:1;height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .25s}
.phase{max-width:560px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.phase span{padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
.phase span.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sbody{flex:1;overflow-y:auto;padding-block:12px 16px;display:flex;flex-direction:column;gap:14px}
.sfoot{padding-block:10px 16px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 8px;align-self:flex-start}
.bigk{font-family:var(--f-kana);font-weight:600;font-size:110px;line-height:1.1;text-align:center;color:var(--accent)}
.bigr{text-align:center;font-size:28px;font-weight:700}
.note{text-align:center;color:var(--muted);font-size:14px;margin-top:-6px}
.exbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.exbox .jp{font-size:21px}
.exbox small{color:var(--muted)}
.qprompt{font-size:14px;color:var(--muted);margin:0}
.qbig{font-size:26px;line-height:1.5;text-align:center;padding:10px 0}
.qbig.kana{font-family:var(--f-kana);font-size:84px;font-weight:600;color:var(--accent);padding:0}
.opts{display:grid;gap:10px}
.opts.k4{grid-template-columns:1fr 1fr}
.opt{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;font-size:16px;min-width:0}
.opts.k4 .opt{text-align:center;font-size:24px;font-weight:700}
.opt .jp{font-size:20px}
.opt.kf{font-family:var(--f-kana);font-size:40px;color:var(--accent);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--stamp);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.slot{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{background:var(--paper);border:1.5px solid var(--line);border-bottom-width:3px;border-radius:10px;padding:7px 11px}
.tile .jp{font-size:19px}
.tile.used{visibility:hidden}
.listen{display:flex;justify-content:center;padding:6px 0}
.listen .play{width:80px;height:80px;border-width:2px}
.listen .play svg{width:28px;height:28px}
.fb{border-radius:14px 14px 0 0;padding:12px 16px 4px;display:flex;flex-direction:column;gap:3px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb strong{font-size:16px}
.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--stamp)}
.fb .jp{font-size:19px}
.fb p{margin:0;font-size:13.5px}
.read{color:var(--muted);font-size:13px}
.done{align-items:center;text-align:center;justify-content:center}
.done .stamp{width:150px;height:150px;border-width:4px}
.done .stamp b{font-size:30px}
.done .stamp span{font-size:13px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:90px}
.stats b{display:block;font-family:var(--f-disp);font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.perks div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.perks b{display:block;font-family:var(--f-disp);font-size:20px}
.perks span{font-size:11.5px;color:var(--muted)}
.souvs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.souv{font-size:12px;border:1px dashed var(--stamp);color:var(--stamp);border-radius:20px;padding:3px 10px}
.gift{border:2px dashed var(--stamp);color:var(--stamp);border-radius:14px;padding:12px 18px;font-weight:700;font-size:17px}
.dim{display:contents}.dim .bub{opacity:.55}
.qbig.ko{font-size:20px;font-weight:700;padding:4px 0}
.play.big{align-self:center;width:56px;height:56px}
.wlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;min-width:0}
.wl b{font-family:var(--f-kana);font-size:19px;color:var(--accent);font-weight:600}
.wl span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.wl.off{opacity:.5}
.py{font-family:var(--f-body);color:var(--muted);font-size:13px}
.en{font-family:var(--f-kana);font-size:1em;line-height:1.45}
.en mark{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 2px}
#sess[hidden]{display:none}
.tabs button{max-width:130px}
.blur{filter:blur(6px);user-select:none}
.bub[data-id]{cursor:pointer}
.bub .fs{color:var(--stamp)}
.gl{display:flex;flex-wrap:wrap;gap:6px 4px;padding:2px 0 4px}
.gc{display:flex;flex-direction:column;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 7px;min-width:0;max-width:100%}
.gt{font-size:17px}.gt .jp,.gt .en{font-size:17px}
.gg{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.3;overflow-wrap:anywhere}
.note2{background:var(--accent-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.note2 p{margin:0;font-size:13.5px;line-height:1.5}
.mean{text-align:center;font-weight:700;margin:-6px 0 0}
.ans{display:flex;flex-direction:column;gap:6px}
.gq{margin:0 0 6px;font-size:13px;color:var(--muted);text-align:center}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3 .btn{padding:11px 4px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:1px}
.g3 small{font-size:11px;font-weight:400;opacity:.8}
.gr0{background:var(--stamp)!important;color:var(--paper)!important}
.gr1{background:var(--line)!important;color:var(--ink)!important}
.gr2{background:var(--ok)!important;color:var(--paper)!important}
#sheet,#onb{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden],#onb[hidden]{display:none}
.shc{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.shc .grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
.star{display:flex;align-items:center;justify-content:center;gap:6px}
.star svg{width:18px;height:18px}
.btn.star{background:transparent;border:1.5px solid var(--stamp);color:var(--stamp)}
.btn.star.on{background:var(--stamp);color:var(--paper)}
.linkbtn.star{align-self:center;color:var(--stamp);text-decoration:none;display:flex}
#onb .shc{max-height:94%}
#onb label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
#onb input,#onb select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px}
#onb small{font-size:12px}
#onb fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
#onb legend{font-size:13px;color:var(--muted);padding:0 4px}
#onb .rd{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.snow{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.snow h3{margin:0 0 2px;font-size:13px;color:var(--muted);font-weight:500}
.snow p{margin:0;font-size:14px}.muted{color:var(--muted);font-size:12.5px}
.snow>div:last-child{min-width:0}
.rollhd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.combo{font-family:var(--f-disp);font-size:15px;color:var(--muted)}
.combo.hot{color:var(--stamp)}
.rollball{display:flex;justify-content:center;transition:transform .2s}
.rolldone{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.tin{width:100%;font:inherit;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
mark.miss{background:var(--bad-soft);color:var(--stamp);border-radius:4px;padding:0 2px}
.phase .cnt{margin-left:auto;border:0;font-variant-numeric:tabular-nums}
.st.p-b{box-shadow:inset 0 -3px 0 var(--accent)}.st.p-g{box-shadow:inset 0 -3px 0 var(--ok)}.st.p-t{box-shadow:inset 0 -3px 0 var(--muted)}.st.p-o{box-shadow:inset 0 -3px 0 var(--stamp)}.st.p-f{box-shadow:inset 0 -3px 0 var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.lg{display:flex;align-items:center;gap:4px}.lg::before{content:"";width:12px;height:3px;border-radius:2px;background:var(--muted)}
.lg.p-b::before{background:var(--accent)}.lg.p-g::before{background:var(--ok)}.lg.p-o::before{background:var(--stamp)}.lg.p-f::before{background:var(--ink)}

.mytag{font-size:10.5px;background:var(--stamp);color:var(--paper);border-radius:6px;padding:1px 6px;margin-left:2px}
.askf{display:flex;flex-direction:column;gap:12px}
.askf label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
.askf select,.askf input,#onb details select,#onb details input{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px}

    return {label:'한자로 스며든 정도',pc,text:`전체 대화 속 글자 중 <b style="color:var(--accent)">${pc}%</b>가 한자로 보여요.`}},

/* ===== 365 엔진 v2 ===== 팩이 LANG, RAW, ORDER_A, ORDER_B, PERSONAL_IDX, UNITS, H 를 정의 */
const TOTAL=365,WEEKS=52,CAP=36;
const $=s=>document.querySelector(s);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PLAY='<svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg>';
const STAR=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const UMAP={};UNITS.forEach(u=>UMAP[u.id]=u);
const UDAY={};UNITS.forEach(u=>(UDAY[u.day]=UDAY[u.day]||[]).push(u.id));

/* ---- 상태 ---- */
const KEY='y365-'+LANG.code+'-v2',IV=[1,3,7,14,30,60,120,240],SIV=[3,7,14,30,60,120];
function fresh(){return {v:2,lang:LANG.code,day:1,last:null,streak:0,best:0,tick:0,items:{},sc:{},souv:[],fav:{},me:null,order:'A',onb:false,slow:false}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===2&&o.lang===LANG.code){o.fav=o.fav||{};return o}}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
const ORDER=(S.order==='B'?ORDER_B:ORDER_A);
const BASEK=['name','age','job','city','hobby'];
const filled=k=>!!S.me&&S.me[k]!=null&&S.me[k]!=='';
function persScene(ri){
  if(ri===PERSONAL_IDX&&S.me){const p=H.personal(S.me);p.L=p.L.map(l=>l.sp==='a'?{...l,me:true}:l);p.V=p.V.map(v=>({...v,me:true}));return p}
  const b=RAW[ri],P=PERS[ri];if(!P||!S.me)return b;
  const L=b.L.slice();let hit=false;
  P.forEach(o=>{if(o.f&&o.k.every(filled)){L[o.i]={sp:b.L[o.i].sp,...o.f(S.me),me:true};hit=true}});
  return {...b,L,notes:hit&&PNOTE[ri]?b.notes.concat(PNOTE[ri]):b.notes}}
const SC=ORDER.map(persScene);
function applyMe(){ORDER.forEach((ri,w)=>{SC[w]=persScene(ri)})}
const slotKeys=ri=>[...new Set((PERS[ri]||[]).flatMap(o=>o.k))].filter(k=>!BASEK.includes(k));
const ALLSLOTS=[...new Set(ORDER.flatMap(ri=>slotKeys(ri)))];
const missingSlots=w=>S.me?slotKeys(ORDER[w]).filter(k=>!filled(k)&&!((S.me._skip||{})[k])):[];
function fieldHTML(k){const d=SLOT[k],v=S.me&&S.me[k]!=null?S.me[k]:'';
  if(d.type==='choice')return `<label>${esc(d.q)}<select id="sl_${k}"><option value="">선택 안 함</option>${OP[d.o].map((o,i)=>`<option value="${i}" ${v!==''&&+v===i?'selected':''}>${esc(o[0])}</option>`).join('')}</select></label>`;
  if(d.type==='number')return `<label>${esc(d.q)}<input id="sl_${k}" type="number" inputmode="numeric" min="${d.min}" max="${d.max}" value="${esc(v)}"></label>`;
  return `<label>${esc(d.q)}<input id="sl_${k}" value="${esc(v)}" autocomplete="off" placeholder="한글로 입력">${LANG.code==='zh'&&k==='memName'?`</label><label>(선택) 이름 한자<input id="sl_${k}Z" value="${esc(S.me&&S.me[k+'Z']||'')}" autocomplete="off" placeholder="예: 敏智 · 모르면 비워 두세요">`:''}</label>`}
function readFields(keys){keys.forEach(k=>{const el=document.getElementById('sl_'+k);if(!el)return;const d=SLOT[k];let v=el.value.trim();
  if(v==='')v=null;else if(d.type==='choice')v=+v;else if(d.type==='number'){v=parseInt(v,10);if(!(v>=d.min&&v<=d.max))v=null}
  S.me[k]=v;const z=document.getElementById('sl_'+k+'Z');if(z)S.me[k+'Z']=z.value.trim();if(v!=null&&S.me._skip)delete S.me._skip[k]})}
function todayNum(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)}
function addItem(id){if(!S.items[id])S.items[id]={b:0,due:todayNum()+1};if(UMAP[id]&&H.learn)H.learn(UMAP[id])}
const has=id=>!!S.items[id];
function relearn(){if(H.reset)H.reset();Object.keys(S.items).forEach(id=>{if(UMAP[id]&&H.learn)H.learn(UMAP[id])})}
relearn();
function curStreak(){if(S.last==null)return 0;const gap=todayNum()-1-S.last;return gap<=0||gap<=S.tick?S.streak:0}
function LN(id){const [s,n]=id.slice(2).split('-').map(Number);const sc=SC[s];
  if(id[0]==='l'){const x=sc.L[n];return {id,sp:x.sp,t:x.t,py:x.py,ko:x.ko,s,i:n,base:n,me:x.me}}
  const x=sc.V[n];return {id,sp:'a',t:x.t,py:x.py,ko:x.ko,s,i:n,base:x.base,v:true,me:x.me}}
function prevB(l){const b=l.base,L=SC[l.s].L;return (b%2===1&&L[b-1].sp==='b'&&(l.v||L[b].sp==='a'))?b-1:-1}
function prevA(l){if(l.v)return -1;const L=SC[l.s].L;return (l.i%2===1&&L[l.i-1].sp==='a'&&L[l.i].sp==='b')?l.i-1:-1}
const notesFor=l=>(SC[l.s].notes||[]).filter(n=>n[0]===l.base).map(n=>n[1]);

/* ---- 소리 ---- */
let voice=null;const hasTTS='speechSynthesis' in window;
function loadV(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>LANG.voicePref.test(v.lang))||vs.find(v=>LANG.voiceRe.test(v.lang))||null}catch(e){}}
if(hasTTS){loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}}
function utter(t,slow){const u=new SpeechSynthesisUtterance(H.speech(t));u.lang=LANG.speech;if(voice)u.voice=voice;u.rate=((slow||S.slow)?0.62:0.92)*LANG.rate;return u}
function speak(t,slow){if(!hasTTS||!t)return;try{speechSynthesis.cancel();speechSynthesis.speak(utter(t,slow))}catch(e){}}
function speakAll(list){if(!hasTTS)return;try{speechSynthesis.cancel();list.forEach(t=>speechSynthesis.speak(utter(t)))}catch(e){}}

function bub(l,o={}){const me=l.sp==='a',who=me?'나':SC[l.s].who;
  return `<div class="bub ${me?'me':'you'} ${o.cls||''}" ${o.nodetail?'':`data-id="${l.id}"`}><span class="who">${esc(who)}${l.me?' <span class="mytag">내 이야기</span>':''}${S.fav[l.id]?' <span class="fs">★</span>':''}</span><div class="bt"><div class="${o.blur?'blur':''}">${H.R(l,o.hl)}</div><button class="play s" data-say="${esc(l.t)}" aria-label="듣기">${PLAY}</button></div>${o.noko?'':`<p class="${o.blur?'blur':''}">${esc(l.ko)}</p>`}</div>`}
function glossHTML(l){const g=H.gloss?H.gloss(l):null;if(!g)return '';
  return `<div class="gl">${g.map(c=>`<span class="gc"><span class="gt">${H.R({t:c.t,py:c.py,s:l.s})}</span><span class="gg">${esc(c.g||'·')}</span></span>`).join('')}</div>`}

/* ---- 하루 구성 ---- */
const DTYPE=['new','new','new','new','final','mix','weekend'];
const DNAME={new:'새 대화',final:'실전',mix:'섞기',weekend:'가벼운 주말',grad:'졸업'};
function dayInfo(D){if(D>=TOTAL)return {type:'grad',w:WEEKS-1,p:7};const w=Math.floor((D-1)/7),p=(D-1)%7;return {type:DTYPE[p],w,p}}
const isQ=id=>!(UMAP[id]&&UMAP[id].noq);
function dueItems(excl){const t=todayNum();return Object.entries(S.items).filter(([id,v])=>v.due<=t&&!(excl&&excl.has(id))&&isQ(id)).sort((a,b)=>a[1].due-b[1].due).map(e=>e[0])}
function dueScenes(){const t=todayNum();return Object.entries(S.sc).filter(([s,v])=>v.due<=t).sort((a,b)=>a[1].due-b[1].due).map(e=>+e[0])}
const doneScenes=()=>Object.keys(S.sc).map(Number);
function plan(D){
  const I=dayInfo(D),units=UDAY[D]||[];
  let fixed=units.reduce((a,id)=>a+(UMAP[id].noq?1:2),0);
  if(I.type==='new')fixed+=3+(I.p*2+2);if(I.type==='final')fixed+=1+SC[I.w].V.length+8;
  const roll={new:5,final:4,mix:8,weekend:10,grad:10}[I.type],reps={new:0,final:0,mix:1,weekend:0,grad:2}[I.type];
  let replay=dueScenes().filter(x=>x!==I.w);if(replay.length<reps)replay=replay.concat(shuffle(doneScenes().filter(x=>x!==I.w&&!replay.includes(x))));
  replay=replay.slice(0,reps);fixed+=replay.length*8;
  const pool=Object.keys(S.items).filter(id=>(id[0]==='l'||id[0]==='v')&&LN(id).sp==='a').length,rollN=Math.min(roll,pool);fixed+=rollN;
  const rev=Math.max(S.day>1?4:0,Math.min(14,CAP-fixed));
  return {...I,units,replay,roll:rollN,rev:Math.min(rev,Object.keys(S.items).filter(isQ).length)};
}
function rank(){let r=LANG.ranks[0][1];LANG.ranks.forEach(([d,n])=>{if(S.day-1>=d)r=n});return r}
const solid=()=>Object.values(S.items).filter(v=>v.b>=3).length;
function snowSVG(n,size){const r=Math.min(48,18+Math.sqrt(n)*2.6),s=size||110;
  return `<svg viewBox="0 0 110 110" width="${s}" height="${s}" aria-hidden="true"><ellipse cx="55" cy="${56+r}" rx="${r*0.9}" ry="4" fill="var(--line)"/><circle cx="55" cy="55" r="${r}" fill="var(--snow)" stroke="var(--line)" stroke-width="1.5"/><circle cx="${55-r*0.35}" cy="${55-r*0.35}" r="${r*0.28}" fill="var(--paper)" opacity=".7"/>${[...Array(Math.min(12,Math.floor(n/8)))].map((_,i)=>{const a=i*2.4,d=r*0.55;return `<circle cx="${55+Math.cos(a)*d}" cy="${55+Math.sin(a)*d}" r="1.6" fill="var(--accent)" opacity=".45"/>`}).join('')}</svg>`}

/* ---- 화면 ---- */
let tab='home';
function viewHome(){
  const today=todayNum(),grad=S.day>TOTAL,D=Math.min(S.day,TOTAL),doneToday=S.last===today,P=plan(D),sc=SC[P.w];
  const learnedN=sc.L.filter((l,i)=>has(`l:${P.w}-${i}`)).length,allN=Object.keys(S.items).length,sol=solid();
  const route=SC.map((x,i)=>`<div class="st ${S.sc[i]?'done':''} ${i===P.w&&!grad?'now':''} ${LANG.partOf(i)}" title="${esc(x.t)}">${i+1}</div>`).join('');
  const prog=H.progress(),unitTxt=P.units.length?P.units.map(id=>H.chip(UMAP[id])).join(' '):'없음';
  let main;

let sess=null;const PH_NAMES=['복습',null,'새 대화','롤플레이','눈덩이','리플레이','내 이야기'];
function rollPool(excl){const all=Object.keys(S.items).filter(id=>(id[0]==='l'||id[0]==='v')&&!excl.has(id)&&LN(id).sp==='a');
  const weak=all.filter(id=>S.items[id].b<3),old=all.filter(id=>S.items[id].b>=3);
  return shuffle(weak).slice(0,Math.ceil(all.length)).concat(shuffle(old))}
function buildSession(D,mode){
  const steps=[],newIds=new Set();
  if(mode==='fav'){const ids=shuffle(Object.keys(S.fav).filter(id=>S.fav[id]&&has(id)&&isQ(id))).slice(0,12);ids.forEach(id=>steps.push({ph:0,t:'q',id,kind:UMAP[id]?null:'recall',bonus:true}));return {steps,i:0,D,mode,right:0,total:0}}
  const P=plan(D);
  if(mode==='day'){P.units.forEach(u=>newIds.add(u));if(P.type==='new'){newIds.add(`l:${P.w}-${P.p*2}`);newIds.add(`l:${P.w}-${P.p*2+1}`)}if(P.type==='final')SC[P.w].V.forEach((v,i)=>newIds.add(`v:${P.w}-${i}`))}
  const revN=mode==='review'?14:P.rev;
  let due=dueItems(newIds).slice(0,revN);
  if(due.length<Math.min(4,revN)){const pool=shuffle(Object.keys(S.items).filter(id=>!newIds.has(id)&&!due.includes(id)&&isQ(id)));due=due.concat(pool.slice(0,Math.min(4,revN)-due.length))}
  shuffle(due).forEach(id=>steps.push({ph:0,t:'q',id}));
  if(mode==='day'){
    P.units.forEach(id=>{steps.push({ph:1,t:'introU',id});if(isQ(id))steps.push({ph:1,t:'q',id,fresh:true})});
    if(P.type==='new')steps.push({ph:2,t:'introEx',s:P.w,e:P.p},{ph:2,t:'q',id:`l:${P.w}-${P.p*2}`,fresh:true},{ph:2,t:'q',id:`l:${P.w}-${P.p*2+1}`,fresh:true},{ph:3,t:'play',s:P.w,n:P.p*2+2,mode:'today'});
    else if(P.type==='final'){steps.push({ph:2,t:'introV',s:P.w});SC[P.w].V.forEach((v,i)=>steps.push({ph:2,t:'q',id:`v:${P.w}-${i}`,fresh:true,kind:'pick'}));steps.push({ph:3,t:'play',s:P.w,n:8,mode:'final'})}
    P.replay.forEach(s=>steps.push({ph:5,t:'play',s,n:8,mode:'replay'}));
  }
  const excl=new Set([...newIds,...due]),rp=rollPool(excl),rn=mode==='review'?Math.min(8,rp.length):P.roll;
  if(rn>0)steps.push({ph:4,t:'roll',ids:rp.slice(0,rn),k:0,combo:0,best:0});
  if(mode==='day'&&P.type==='new'&&P.p===0){const ms=missingSlots(P.w);if(ms.length)steps.unshift({ph:6,t:'ask',keys:ms,w:P.w})}
  if(!steps.length)steps.push({ph:0,t:'empty'});
  return {steps,i:0,D,P,mode,right:0,total:0};
}
function start(mode){sess=buildSession(Math.min(S.day,TOTAL),mode);$('#sess').hidden=false;document.body.style.overflow='hidden';step()}
function close(){$('#sess').hidden=true;document.body.style.overflow='';try{speechSynthesis.cancel()}catch(e){}save();render()}
function next(){sess.i++;if(sess.i>=sess.steps.length)return finish();step()}
const foot=h=>{$('#sf').innerHTML=h};
function contBtn(label,fn){foot(`<button class="btn" id="go">${label||'계속'}</button>`);$('#go').onclick=fn||next;$('#go').focus({preventScroll:true})}
function phaseBar(cur){const used=[...new Set(sess.steps.map(s=>s.ph))];$('#ph').innerHTML=used.map(p=>`<span class="${p===cur?'on':''}">${p===1?LANG.unitName:PH_NAMES[p]}</span>`).join('')+`<span class="cnt">${sess.i+1}/${sess.steps.length}</span>`}
function step(){
  const st=sess.steps[sess.i],sb=$('#sb');
  $('#sp').style.width=(sess.i/sess.steps.length*100)+'%';phaseBar(st.ph);sb.scrollTop=0;

  else if(st.t==='introV'){const sc=SC[st.s];const rows=sc.V.map((v,i)=>{const l=LN(`v:${st.s}-${i}`);addItem(l.id);const base=LN(`l:${st.s}-${v.base}`);
      return `<div class="exbox"><small>원래 대사</small>${H.R(base)}<small>${esc(base.ko)}</small><small style="margin-top:6px">이렇게 바꿔 말할 수 있어요</small><div class="chat">${bub(l)}</div></div>`}).join('');
    save();sb.innerHTML=`<span class="tag">바꿔 말하기 · ${esc(sc.t)}</span><p class="qprompt">이번 주 대화에서 낱말만 바꾸면 다른 상황에도 써요. 대사를 누르면 해설이 나와요.</p>${rows}`;contBtn('다 읽었어요')}
  else if(st.t==='q'){if(!st.q)st.q=makeQ(st);drawQ(st)}

  else if(st.t==='ask'){sb.innerHTML=`<span class="tag">내 이야기 카드</span><h2 style="margin:0">이번 주 「${esc(SC[st.w].t)}」</h2><p class="qprompt">이번 주 대화의 내 대사가 내 이야기로 바뀌어요. 고르기만 하면 되고, 나중에 설정에서 바꿀 수 있어요.</p><div class="askf">${st.keys.map(fieldHTML).join('')}</div>`;

    ${gift!=null?`<div class="gift">${esc(souvName(gift))}</div>`:''}${newTick?'<p class="ctx" style="margin:0">7일 연속! 휴가권 1장을 받았어요.</p>':''}
    <div class="stats"><div><b>${sess.total?Math.round(sess.right/sess.total*100):100}%</b><span>정답률</span></div><div><b>${curStreak()}</b><span>연속 일수</span></div><div><b>${solid()}</b><span>단단한 표현</span></div></div></div>`;
  contBtn('홈으로',close)}

document.addEventListener('click',e=>{
  const sl=e.target.closest('[data-slow]');if(sl){speak(sl.dataset.slow,true);return}
  const say=e.target.closest('[data-say]');if(say){speak(say.dataset.say);return}
  const fv=e.target.closest('[data-favt]');if(fv){const id=fv.dataset.favt;S.fav[id]=!S.fav[id];if(!S.fav[id])delete S.fav[id];save();const on=!!S.fav[id];fv.classList.toggle('on',on);fv.innerHTML=`${STAR(on)} ${fv.classList.contains('btn')?(on?'즐겨찾기 해제':'즐겨찾기'):'즐겨찾기'}`;if(tab==='fav'&&$('#sess').hidden)render();return}
  const bd=e.target.closest('.bub[data-id]');if(bd&&!e.target.closest('button')){openSheet(bd.dataset.id);return}
  const un=e.target.closest('[data-unit]');if(un){openSheet(un.dataset.unit);return}
  if(e.target.closest('[data-close]')||e.target.id==='sheet'){closeSheet();return}
  const all=e.target.closest('[data-all]');if(all){const s=+all.dataset.all;speakAll(SC[s].L.filter((l,i)=>has(`l:${s}-${i}`)).map(l=>l.t));return}
  const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const us=e.target.closest('[data-uset]');if(us&&H.uset){H.uset(us.dataset.uset);render();return}
  if(e.target.id==='slow'){S.slow=!S.slow;save();e.target.setAttribute('aria-pressed',S.slow);return}
  if(e.target.id==='ordB'){S.order=S.order==='B'?'A':'B';save();location.reload();return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,msg=$('#msg');
  if(act==='start'||act==='ahead')start('day');else if(act==='review')start('review');else if(act==='favrev')start('fav');
  else if(act==='onb')openOnb();else if(act==='onbsave')saveOnb();else if(act==='onbclose')$('#onb').hidden=true;
  else if(act==='onbskip'){S.onb=true;save();$('#onb').hidden=true;render()}
  else if(act==='mesay')speakAll(SC.flatMap((x,s)=>x.L.filter((l,i)=>l.me&&l.sp==='a'&&(s===0||has(`l:${s}-${i}`)))).map(l=>l.t));
  else if(act==='export'){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const ta=$('#bk');ta.value=code;const fall=()=>{ta.select();msg.textContent='코드를 선택해 두었어요. 길게 눌러 복사하세요.'};
    try{navigator.clipboard.writeText(code).then(()=>{msg.textContent='백업 코드를 복사했어요.'},fall)}catch(err){fall()}}
  else if(act==='import'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim()))));if(!o||o.v!==2||o.lang!==LANG.code)throw 0;S=o;S.fav=S.fav||{};save();location.reload()}
    catch(err){msg.style.color='var(--stamp)';msg.textContent=`코드를 읽지 못했어요. 이 ${LANG.name} 앱에서 복사한 코드 전체를 붙여넣어 주세요.`}}
  else if(act==='reset1'){$('#r1').hidden=true;$('#r2').hidden=false}else if(act==='reset0'){$('#r1').hidden=false;$('#r2').hidden=true}
  else if(act==='reset2'){const o=S.order;S=fresh();save();location.reload()}
});
$('#sx').onclick=close;
render();
if(!S.onb)openOnb();

</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
